[workspace]
resolver = "2"
members = ["crates/vs-core", "crates/vs-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Voice Studio contributors"]
repository = "https://github.com/voice-studio/voice-studio"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Keep DSP fast in debug test runs.
[profile.dev.package."*"]
opt-level = 2
