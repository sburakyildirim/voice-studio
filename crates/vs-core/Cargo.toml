[package]
name = "vs-core"
description = "Core library for Voice Studio: markup, G2P, engines, audio, projects, downloads"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
dirs.workspace = true
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "isomp4", "aac"] }
ndarray = "0.17"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"
unicode-normalization = "0.1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23", "directml"] }
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23", "coreml"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-23"] }

[dev-dependencies]
tempfile = "3"
