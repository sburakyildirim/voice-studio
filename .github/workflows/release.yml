name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
          - os: macos-14
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Voice Studio ${{ github.ref_name }}
          releaseBody: "See CHANGELOG and docs/BENCHMARKS.md. Models are downloaded inside the app (Options › Models)."
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "voice-studio-${{ github.ref_name }}-windows-x64-portable"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/voice-studio.exe $out/
          Set-Content -Path "$out/portable.txt" -Value "Delete this file to store data in %LOCALAPPDATA%\VoiceStudio instead of next to the app."
          Compress-Archive -Path $out -DestinationPath "$out.zip"
          gh release upload ${{ github.ref_name }} "$out.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
